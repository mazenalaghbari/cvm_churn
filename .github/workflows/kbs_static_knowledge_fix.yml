name: KBS static knowledge correction

on:
  push:
    branches:
      - kbs-static-knowledge-fix-20260717
    paths-ignore:
      - 'kbs_static_fix/outputs/**'

permissions:
  contents: write

jobs:
  run-corrected-analysis:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: kbs-static-knowledge-fix-20260717
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn xgboost shap matplotlib

      - name: Run corrected leakage-free pipeline
        run: |
          rm -rf kbs_static_fix/outputs
          python kbs_static_fix/run_corrected_pipeline.py \
            --data data/raw_sources/churn_dataset.csv \
            --out kbs_static_fix/outputs

      - name: Commit locked outputs to revision branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kbs_static_fix/outputs
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Add corrected KBS analysis outputs [skip ci]"
            git push origin HEAD:kbs-static-knowledge-fix-20260717
          fi
