name: Temporary KBS static correction runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-correction:
    if: ${{ github.head_ref == 'kbs-static-knowledge-fix-20260717' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out KBS revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}