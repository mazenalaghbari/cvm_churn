name: Temporary KBS static correction runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-correction:
    if: ${{ github.head_ref == 'kbs-static-knowledge-fix-20260717' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out KBS revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn xgboost shap matplotlib

      - name: Run corrected leakage-free pipeline
        run: |
          rm -rf kbs_static_fix/outputs
          python kbs_static_fix/run_corrected_pipeline.py \
            --data data/raw_sources/churn_dataset.csv \
            --out kbs_static_fix/outputs

      - name: Commit locked outputs to revision branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kbs_static_fix/outputs
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Add corrected KBS analysis outputs [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
